name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The example/launcher projects are still old-style .NET Framework and are
      # excluded until their own migration; CI targets the library + test project,
      # which is what needs to stay green for the TDD loop.
      - name: Restore
        run: dotnet restore RenderLike.Tests/RenderLike.Tests.csproj

      - name: Build
        run: dotnet build RenderLike.Tests/RenderLike.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test RenderLike.Tests/RenderLike.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
